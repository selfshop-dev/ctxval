name: Labeler

on:
  pull_request_target:
    branches: [ main ]
    types:    [ opened, edited, synchronize, reopened ]

permissions: {}

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read
      pull-requests: write
      statuses: write

    steps:
      # multi-labeler does not create labels, and adding an unknown label fails
      # the run. Every label in .github/labeler.yml must exist in repository settings.
      - uses: fuxingloh/multi-labeler@v5
