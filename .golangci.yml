version: '2'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  modules-download-mode: readonly
  timeout: 5m

linters:
  default: standard
  enable:
    - testifylint
    - testableexamples
  settings:
    govet:       { enable-all: true, disable: [ fieldalignment ] }
    testifylint: { enable-all: true }

formatters:
  enable:
    - goimports
    - gofmt

  settings:
    goimports: { local-prefixes: [ github.com/selfshop-dev/ctxval ] }
    gofmt:
      rewrite-rules:
        - pattern:     interface{}
          replacement: any
